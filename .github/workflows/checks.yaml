name: checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install poetry==2.3.2
      - run: poetry sync
      - run: poetry run pre-commit run --all-files
      - run: poetry run pytest -m 'not integration'
