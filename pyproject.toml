[project]
name = "payment-processing"
dynamic = ["version"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "faststream[rabbit]>=0.6,<0.7",
    "httpx>=0.28,<1",
]

[tool.poetry]
packages = [{ include = "payment_processing", from = "src" }]
include = [{ path = "VERSION", format = "sdist" }]
version = "0.0.0"

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = ">=1.9,<2", extras = ["plugin"] }

[tool.poetry-dynamic-versioning]
enable = true

[tool.poetry-dynamic-versioning.from-file]
source = "VERSION"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.9,<1"
mypy = ">=1.14,<2"
pytest = ">=8.3,<10"
pytest-asyncio = ">=0.25,<2"
pre-commit = ">=4,<5"

[build-system]
requires = ["poetry-core>=2,<3", "poetry-dynamic-versioning>=1.9,<2"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true
explicit_package_bases = true
mypy_path = "src"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --import-mode=importlib"
markers = ["integration: requires PostgreSQL or RabbitMQ"]
