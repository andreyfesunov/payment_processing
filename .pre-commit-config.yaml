default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: poetry run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format check
        entry: poetry run ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy strict
        entry: poetry run mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: commitlint
        name: commitlint
        entry: node node_modules/@commitlint/cli/cli.js --edit
        language: system
        stages: [commit-msg]
        always_run: true
